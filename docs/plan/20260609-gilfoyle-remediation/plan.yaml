      - id: "task-12"
        title: "Fix empty response returning '{}'"
        severity: medium
        status: pending
        files: ["src/providers/vscodeLmProvider.ts"]
        description: >
          When collectStreamText gets empty text, return empty string instead of '{}'
          so the analyzer properly throws rather than silently producing zero results.

      - id: "task-13"
        title: "Broaden bearer token sanitization in errors"
        severity: medium
        status: pending
        files: ["src/providers/externalProvider.ts"]
        description: >
          Extend error sanitization to cover all error propagation paths, not just
          the catch block.

  - id: 3
    name: "Low & Nit"
    tasks:
      - id: "task-14"
        title: "Fix DEFAULT_ACCEPTED_FINDINGS_PATH"
        severity: low
        status: pending
        files: ["src/core/acceptedFindings.ts"]
        description: >
          Change DEFAULT_ACCEPTED_FINDINGS_PATH to not use process.cwd().
          Add a comment noting callers should use workspaceFolders[0].

      - id: "task-15"
        title: "Add validation for non-atomic MCP config write"
        severity: low
        status: pending
        files: ["src/extension.ts"]
        description: >
          Add a try-catch around renameSync for the MCP config write
          and clean up temp file on failure.

      - id: "task-16"
        title: "Add MCP server fixStrategy support"
        severity: low
        status: pending
        files: ["src/mcp/server.ts"]
        description: >
          Read fixStrategy from resolved config instead of hardcoding additive: true.

