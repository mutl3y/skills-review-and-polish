      - id: "task-10"
        title: "Engine.surgicalFix: handle untitled document filePath"
        severity: high
        status: pending
        agent: gem-implementer
        files: ["src/core/index.ts", "src/core/fixer.ts"]
        description: >
          Issue #19: When filePath is undefined (untitled docs), fixer gets ''
          and loadReferenceGrounding tries path.dirname('') = '.', loading
          references from CWD. Add null guard and skip reference grounding
          when filePath is empty/undefined.

      - id: "task-11"
        title: "Tighten factualGroundingTrigger regex"
        severity: high
        status: pending
        agent: gem-implementer
        files: ["src/core/fixer.ts"]
        description: >
          Issue #11: The regex /\b[A-Z][a-z]+\b/g triggers reference grounding
          loading for ANY text with 2+ capitalized words (natural language).
          Instead, require ALL of: (a) the trigger text appears in a bullet/list
          context, (b) at least one proper noun-like pattern (2+ capitalized
          words in sequence), AND (c) exclude common English sentence starters.
          Or better: only trigger when text matches the finding's anchor pattern,
          not a separate heuristic.

