    name: "Critical Security & Logic Fixes"
    tasks:
      - id: "task-01"
        title: "Guard empty anchor in fixIssue String.replace"
        severity: critical
        status: pending
        agent: gem-implementer
        files: ["src/extension.ts"]
        description: >
          Issue #7: In fixIssue, text.split(anchor).length-1 crashes when anchor
          is empty string (split('') returns char array). Add early guard:
          if (!anchor) return; Also use replace with a function to prevent
          regex-like behavior on special chars.

      - id: "task-02"
        title: "MCP accept_finding input sanitization"
        severity: critical
        status: pending
        agent: gem-implementer
        files: ["src/mcp/server.ts", "src/core/acceptedFindings.ts"]
        description: >
          Issue #16: The accept_finding tool stores relevantText directly in
          .accepted-findings.json with no validation. Add:
          - Max length check (200 chars)
          - Minimum meaningful length (3+ chars)
          - Reject overly generic patterns (single chars, common words like "a","the","is")
          - JSON-safe encoding
          - Rate limiting per session

      - id: "task-03"
        title: "Add AbortController propagation to LLM calls"
        severity: critical
        status: pending
        agent: gem-implementer
        files: ["src/core/analyzer.ts", "src/providers/vscodeLmProvider.ts"]
        description: >
          Issue #20: Analyzer.analyze() has no cancellation support. Individual
          LLM calls within waves cannot be cancelled. Add CancellationToken
          parameter to Analyzer.analyze() and pass through to provider.sendRequest().
          Check token between each prompt call within a wave.

      - id: "task-04"
        title: "externalProvider: Don't retry non-retryable HTTP errors"
        severity: critical
        status: pending
        agent: gem-implementer
        files: ["src/providers/externalProvider.ts"]
        description: >
          Issue #15: fetchWithRetry retries ALL errors including 400/401/403
          (permanent errors) wasting API calls. Fix: parse status code from
          thrown error in fetchJson, check isRetryable() BEFORE retrying.
          Non-retryable errors should throw immediately without retry.

