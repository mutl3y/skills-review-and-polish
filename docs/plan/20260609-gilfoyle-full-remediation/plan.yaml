decisions:

  - id: "ADR-001"
    issue: "#1-2 — Prompt injection via readLinkedPromptFiles"
    decision: "Path validation with 4-layer defense"
    rationale:
      - "Added path traversal rejection (..)"
      - "Added absolute path rejection"
      - "Added symlink rejection (lstatSync + isSymbolicLink)"
      - "Added directory boundary check (path.resolve + startsWith)"
      - "Full 'review mode' feature was considered and rejected — the extension UI (CodeLens, inline rewrites, diagnostics) already IS a review mode. Users must click to apply fixes."
    status: "IMPLEMENTED"
    files: ["src/core/analyzer.ts"]

  - id: "ADR-002"
    issue: "#3-4 — LLM-as-judge trust boundary"
    decision: "Accept current risk — existing safety gates sufficient"
    rationale:
      - "The surgical fixer has meaningPreservationReject which blocks destructive changes"
      - "Diagnostics are shown as squiggles — user must act"
      - "CodeLens shows 'Apply Fix' — user must click"
      - "Inline rewrites show suggestions — user must accept"
      - "Only MCP fix_document bypasses user consent, but that's called by AI agents who control their own risk"
      - "Adding a full 'review mode' is a feature request, not a security fix"
      - "Risk: A compromised model could inject fake diagnostics. Mitigated by meaningPreservationReject preventing >1.5x content growth."
    status: "ACCEPTED RISK"
    files: []

  - id: "ADR-003"
    issue: "#5 — Prompt loading race condition"
    decision: "Skip — not a real risk"
    rationale:
      - "VS Code serializes document events — two analyses of the same doc cannot overlap in practice"
      - "Even if they did, prompt files are immutable per-analysis"
      - "Adding locks would add complexity for zero real-world benefit"
    status: "SKIPPED"
    files: []

  - id: "ADR-004"
    issue: "#6 — Code fence fragility in JSON extraction"
    decision: "Skip — already mitigated by salvageTruncatedJSON"
    rationale:
      - "The salvageTruncatedJSON function recovers truncated arrays from malformed LLM output"
      - "Edge cases with nested fences are extremely rare in practice"
      - "If a future model returns truly broken JSON, the analyzer returns empty results (fail-safe, not fail-dangerous)"
    status: "SKIPPED"
    files: []

  - id: "ADR-005"
    issue: "#8 — Levenshtein O(n²) performance in loop detection"
    decision: "Accept — bounded by LRU cap"
    rationale:
      - "analysisHistory now capped at 100 entries via LRU eviction (task-05)"
      - "Text length capped at 100 chars"
      - "Worst case: 100×100×100² = 100M operations — but in practice analyses have <20 recs per doc"
      - "Can add fingerprint pre-filtering if profiling shows it's slow"
    status: "ACCEPTED — MONITOR"
    files: []

  - id: "ADR-006"
    issue: "#12 — model.dispose?.() silently swallows errors"
    decision: "Log errors instead of swallowing"
    rationale:
      - "Changed bare catch {} to named catch with this.log.info('[WARN] model.dispose() failed')"
      - "Errors still not rethrown — dispose failure should not block the retry path"
      - "But now visible in debug output for troubleshooting"
    status: "IMPLEMENTED"
    files: ["src/providers/vscodeLmProvider.ts"]

  - id: "ADR-007"
    issue: "copilotPricing.ts dead code"
    decision: "Keep file — backward compatibility"
    rationale:
      - "File duplicates data in pricing.ts (which fetches live + static fallback)"
      - "No internal code imports it — only docs reference it"
      - "Retained for 'backward compatibility with external consumers' per original author's note"
      - "Annotated with note explaining it's a static subset of pricing.ts"
      - "Could be deleted in a future major version"
    status: "KEPT — ANNOTATED"
    files: ["src/copilotPricing.ts"]

