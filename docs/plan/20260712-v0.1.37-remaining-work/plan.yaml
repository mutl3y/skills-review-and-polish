tasks:

  - id: E43-coverage-prompt
    title: Investigate coverage-gap under-detection (5/13, 5/15)
    priority: high
    estimated_effort: 2-3 hours
    rationale: >
      The coverage wave underperforms on test-coverage-gaps (5/13, 38%) and
      test-coverage-gaps-hard (5/15, 33%). E40d-style "Default: FLAG" treatment
      worked for ambiguity; the same principle may apply to coverage.
    approach:
      - Read current `src/core/prompts/coverage.prompt` to understand the structure
      - Read `scripts/e31-prompt-fix-eval.mjs` and `notes/e31-prompt-fix.md`,
        `e32-corpus-rescan.md` to understand what E31/E32 already changed
      - Hypothesis: the LLM is under-firing on coverage gaps. Add "Default: FLAG"
        framing similar to E40d
      - Iterate prompt versions (e.g. v2, v3) with probe-then-full-E33 discipline
      - Aggregate 6+ runs before ship/revert decisions
    success_metric: "coverage-gap recall on test-coverage-gaps and test-coverage-gaps-hard improves without regression on test-coverage-gaps fixtures at PASS"
    related_artifacts:
      - src/core/prompts/coverage.prompt
      - scripts/e31-prompt-fix-eval.mjs
      - .github/experiments/documentation-review/notes/e31-prompt-fix.md
      - .github/experiments/documentation-review/notes/e32-corpus-rescan.md
    expected_output:
      - .github/experiments/documentation-review/notes/e43-coverage-prompt.md
      - (optional) Updated src/core/prompts/coverage.prompt if a v2 wins

  - id: E44-contradictions-subtle-fixture
    title: Apply realistic-structure principle to test-contradictions-subtle
    priority: medium
    estimated_effort: 30 min
    rationale: >
      Current pass rate: 0/6 hygiene, 0/2 cognitive. Same pattern as the
      pre-redesign test-contradictions-direct fixture (rules in the same
      section as their contradictions). The redesigned-direct principle
      (separate sections) may help.
    approach:
      - Read current `tests/fixtures/primary/test-contradictions-subtle/SKILL.md`
      - Decide if the issue is fixture structure or prompt calibration
      - If fixture: split each SUBTLE's positive rule and contradicting rule
        into clearly-separated sections, like the redesigned contradictions-direct
      - If prompt: defer to E43 (the coverage prompt work may inform coverage
        and other prompt work)
    caution: >
      The previous E41 attempt (test-contradictions-direct redesign) showed that
      a single E33 run can be misleading. Run 6+ E33 invocations before
      deciding ship/revert.
    success_metric: "hygiene 0/6 → ≥3/6 OR cognitive 0/2 → ≥1/2"
    related_artifacts:
      - tests/fixtures/primary/test-contradictions-subtle/SKILL.md
      - .github/experiments/documentation-review/notes/e41-fixture-redesign.md
    expected_output:
      - .github/experiments/documentation-review/notes/e44-subtle-fixture.md
      - (optional) Updated fixture if redesign helps

  - id: E45-circular-detection
    title: Investigate circular detection (2/10 on test-circular-hard)
    priority: low
    estimated_effort: 1-2 hours
    rationale: >
      Pre-existing issue. The circular wave finds 2/10 expected circular
      definitions. May be a prompt or post-processor issue. Lower priority
      because circular definitions are rare in real-world skills.
    approach:
      - Read `src/core/prompts/hygiene.prompt` and search for circular-related rules
      - Check `src/core/findingFilter.ts` for any circular-specific rules
      - Test with focused mode on test-circular-hard to see what the LLM actually finds
    success_metric: "circular recall on test-circular-hard improves to ≥5/10"
    expected_output:
      - .github/experiments/documentation-review/notes/e45-circular-detection.md

  - id: E46-test-dead-hard-regression
    title: Verify test-dead-hard 0/12 regression is OpenRouter noise, not real
    priority: low
    estimated_effort: 15 min
    rationale: >
      E42 had test-dead-hard / hygiene-dead-instruction = 0/12 due to all 3
      runs timing out (OpenRouter slow that day). E40d and E41b had 12/12.
      Need to re-run to confirm.
    approach:
      - `node scripts/e33-fixture-validation.mjs` (should complete normally
        if OpenRouter is faster)
      - If still timing out, increase `PER_CALL_TIMEOUT_MS` in
        `scripts/e33-fixture-validation.mjs` to 600000 (10 min)
    expected_output: "Note confirming 12/12 PASS in E47 (next run)"

  - id: E4-specification-style
    title: E4 — Specification-style prompt experiment (planned from E2)
    priority: low
    estimated_effort: 2-4 hours
    rationale: >
      E4 is in the EXPERIMENTS backlog from E2 era. Would test whether
      writing skills in spec-style (declarative, testable) vs narrative-style
      changes the analyzer's findings on the same content. Would require
      creating paired fixtures.
    approach:
      - Read `.github/experiments/EXPERIMENTS.md` and `.github/experiments/SUCCESS-CRITERIA.md`
        to understand the original E4 scope
      - Create 2-3 paired fixtures (narrative + spec versions of same content)
      - Run analyzer on both, measure finding distribution
    caution: >
      E4 was originally planned but never executed. The priority is lower
      because the E40d ambiguity work has higher impact and is closer to
      shipping. Defer to a future session if resources are limited.
    expected_output:
      - .github/experiments/documentation-review/notes/e4-specification-style.md

  - id: E6-multi-model-comparison
    title: E6 — Mark as completed (already covered by E12-N3 cross-model work)
    priority: trivial
    estimated_effort: 5 min
    rationale: >
      E6 was "multi-model comparison" in the original E2-era backlog. This
      was implicitly completed by the E12-N3 work (gemini-flash-lite vs
      qwen/qwen3-coder-30b cross-model benchmark) and E25 (model comparison).
      Should be marked completed with a reference rather than re-executed.
    approach:
      - Update `.github/experiments/EXPERIMENTS.md` to mark E6 as completed
      - Reference `.github/experiments/documentation-review/notes/e12-n3-analysis.md`
        and `e25-model-comparison.md`
    expected_output: "Updated EXPERIMENTS.md entry"

  - id: E47-publish-v0.1.37
    title: Publish v0.1.37 after E43-E46 complete
    priority: high
    estimated_effort: 30 min
    rationale: >
      v0.1.36 is committed but not yet published to the marketplace. Once
      E43-E46 land meaningful improvements, ship v0.1.37 with the new
      prompts and any new fixtures.
    approach:
      - Update `package.json` version 0.1.36 → 0.1.37
      - Add CHANGELOG entry with all E43-E46 results
      - Run `npm run compile` to verify clean
      - Run `npx vitest run --config tests/vitest.config.ts --exclude="**/server.integration.test.ts"` to verify tests
      - Commit and publish
    success_metric: "v0.1.37 published, 466+ tests pass, compile clean"
    expected_output: "v0.1.37 commit + marketplace publish"

