principles:
  aggregate_before_deciding: >
    Single E33 runs are too noisy for per-fixture decisions. Aggregate 6+
    runs (3 runs × 2 E33 invocations on different days) before making
    ship/revert decisions. Documented in e41-fixture-redesign.md lessons.
  probe_first: >
    For prompt iterations, use `scripts/e40c-ambiguity-probe.mjs` (or
    analogous) to test on 3 key fixtures in <2 min before running full
    E33. Probe ≠ full E33 — always validate with full E33.
  realistic_fixtures: >
    The redesigned test-contradictions-direct fixture (separated
    ambiguities from contradictions) revealed hidden findings the v1
    fixture was suppressing. Apply the same "realistic structure"
    principle to fixtures where it's missing.
  document_what_didnt_work: >
    Negative results (E40b, E40c, E40g, E41-attempt) are valuable —
    they prevent future sessions from re-doing the same dead ends.
    Always commit the "rejected" note even if the experiment failed.

