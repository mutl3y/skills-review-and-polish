  - id: E15
    title: Fixed scoreSkill "empty results = Ungraded" bug
    change_summary: |
      The scoreSkill function in src/core/scoring.ts had a bug: when
      results.length === 0, it returned grade='Ungraded' with score=0.
      This is WRONG when re-computing grades from saved findings: an
      empty results array means the analyzer found nothing (clean
      skill), not that analysis failed.

      The original intent was to flag "incomplete analysis" (all
      waves failed or rate-limited), but the check conflated two
      different states. Fixed by: only return 'Ungraded' when ALL
      results are infra codes (llm-error, llm-parse-error, etc.) or
      llm-rate-limited. Empty results without infra codes = clean
      skill = A+ minus lengthPenalty.

      Updated 1 test (the "reports incomplete flag correctly" test)
      that asserted the buggy behavior. All 18 scoring tests + 448
      unit tests pass.
    files_modified:
      - src/core/scoring.ts (early-return logic reworked)
      - src/core/scoring.test.ts (1 test updated to assert fixed behavior)
    hypothesis_verdict: SUPPORTED — the fix correctly distinguishes
      "clean skill" from "analysis failed" and gives clean skills the
      A+ grade they deserve.
    impact_on_E13_baseline: |
      After the E14 length tier tune AND the E15 scoring fix, the
      15-skill E13 baseline now shows:
