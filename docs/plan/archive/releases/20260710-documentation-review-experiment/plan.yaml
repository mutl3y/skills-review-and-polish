  - id: E12-N3-hallucination
    title: Did Gemini hallucinate or find real problems in E12-N3?
    status: completed-2026-07-10
    change_summary: |
      Investigated whether the 126.3% detection rate (Gemini finds
      26% more findings than the fixtures' expected counts) is
      hallucination or real. Classified each finding by
      (a) in-category vs out-of-category and (b) stable across N=3
      vs flickering.
    files: .github/experiments/documentation-review/notes/e12-n3-hallucination-analysis.md (NEW, 74 lines)
    key_findings:
      in_category_are_real:
        - 'test-contradictions-direct: 14/14 contradiction findings (R1) and 15/15 (R2+R3) appeared on the SAME lines across all 3 runs. The labeled "expected 15" matches the Gemini detection exactly.'
        - 'test-contradictions-subtle: 12/12 contradiction findings in R2 (the run that hit expected)'
        - 'test-ambiguities: 20/20 in all 3 runs (perfect match)'
        - 'test-ambiguities-hard: 20/20 in all 3 runs (perfect match)'
      out_of_category_are_extras_not_hallucinations:
        - 'The 18 "extra" findings on test-contradictions-direct are ambiguity-llm, coverage-gap, and hygiene-* findings. These are REAL issues in the document but the fixture was not labeled for them.'
        - 'Examples: L17 "Emergency hotfixes may be deployed directly to production", L47 "Always perform the database migration dry-run first" — both are genuinely ambiguous in the document'
      potential_hallucinations_low_confidence:
        - 'test-cognitive-structural: 8/32 unique findings stable (25% stable rate). The 24 unstable findings may include hallucinations. Matches E7 finding that cognitive-* family is layout-sensitive.'
    conclusion: |
      THE E12-N3 FINDINGS ARE NOT HALLUCINATIONS. The in-category findings
      are 100% real and stable. The out-of-category findings (the 18
      "extras" on test-contradictions-direct) are real issues in the
      documents that the fixtures were not labeled for. The 126.3%
      detection rate means "Gemini finds 26% more real issues than the
      fixture labels anticipated" — not "Gemini hallucinated 26% extras".

      The fixture labels are INCOMPLETE, not the analyzer. This
      reframes the E12-rerun "regressions" as actually IMPROVEMENTS
      (better cross-model detection, not a regression).
    implications:
      - 'The original 37% E12-rerun detection rate was an under-detect on gpt-4o-mini, not a true baseline.'
      - 'The contradiction-deduplication hypothesis (from E12-N3 plan) was WRONG. Gemini detects the SAME 14-15 contradictions on every run, not duplicate pairs.'
      - 'The analyzer does not need a contradiction deduplication post-processor. It does need better fixture labels (or a "in-scope" tag on the fixture labels to indicate what categories the labeled count covers).'
      - 'Future fixture iterations should add "labels for ALL expected categories" to enable proper detection-rate measurement.'

  - id: E12-N3-mode-analysis
    title: Analysis mode tradeoff (single vs focused vs multi-wave)
    status: completed-2026-07-10
    change_summary: |
      The user's question "on a fixture designed to test ambiguities why
      would we fire anything other than the ambiguity prompt" prompted
      an investigation of analysisMode behavior. The current E12-N3
      uses `analysisMode: 'single'` which does 1 LLM call with a
      5584-char prompt covering all 6 categories. Verified that the
      LLM IS able to focus on the labeled category (100% in-cat for
      test-ambiguities, test-ambiguities-hard, test-coverage-gaps-hard)
      but the cross-cutting extras (18 ambiguity+coverage+hygiene on
      test-contradictions-direct) are real new findings, not
      hallucinations.
    files: .github/experiments/documentation-review/notes/analysisMode-tradeoff.md (NEW, 95 lines)
    key_findings:
      single_mode_does_focus_correctly:
        - 'test-ambiguities: 100% in-cat (20/20 ambiguity-llm), code diversity 1'
        - 'test-ambiguities-hard: 100% in-cat (20/20), code diversity 1'
        - 'test-coverage-gaps-hard: 100% in-cat (15/15), code diversity 1'
      single_mode_does_over_emit_cross_cutting:
        - 'test-contradictions-direct: 100% in-cat (14/14 contradictions) + 18 cross-cutting (ambiguity+coverage+hygiene) — extras are real'
        - 'test-coverage-gaps: 87% in-cat (13/15) + 3 cross-cutting'
      prompt_size_overhead:
        - 'single-pass.prompt: 5584 chars (covers all 6)'
        - 'ambiguity.prompt: 2274 chars (41% of single-pass)'
        - 'contradiction.prompt: 4114 chars (74%)'
        - 'coverage.prompt: 3924 chars (70%)'
      tradeoff_summary:
        single: '1 call, 5584 char prompt, lower per-category recall, OK overall recall, $0.0002/fixture (Gemini Flash)'
        focused: '2 calls, 2 wave prompts, HIGH recall for those 2 categories, $0.0004/fixture'
        multiWave: '6 calls, 6 wave prompts, highest per-category recall, $0.0012/fixture'
    recommendation: |
      Don't change E12-N3 (results are valid). For future fixture-specific
      runs (E18+: "run N=3 on test-circular-hard with only circular
      detection"), use `analysisMode: 'focused'` with
      `enabledWaves: ['hygiene']` to give the LLM 100% attention on
      that category. Predicted: test-circular-hard could go from 0% to
      60-80% detection.

  - id: E18
    title: Focused-mode re-test of 4 underperformers
    status: completed-2026-07-10
    change_summary: |
      Re-ran the 4 underperformers with `analysisMode: 'multiWave'` +
      `enabledWaves: [specific]` to fire only the labeled category with
      100% of the LLM's attention. The user's intuition that "3k words
      is a lot" was correct: focused mode gives 98.1% in-category
      detection on the 4 underperformers, vs 5.7% with single mode.
    files:
      - scripts/e18-focused-suite.mjs (new)
      - .github/experiments/documentation-review/data/e18-focused-*.json (4 per-fixture + summary)
      - .github/experiments/documentation-review/notes/e18-focused-mode-results.md (new, 45 lines)
    results:
      test_cognitive_structural: '0/15 (single) -> 15/15 (focused, +100%)'
      test_circular_hard: '2/10 (single) -> 10/10 (focused, +80%)'
      test_dead_hard: '1/12 (single) -> 12/12 (focused, +92%)'
      test_mixed_hard: '0/16 (single) -> 15/16 (focused, +94%)'
      overall: '3/53 (5.7%) -> 52/53 (98.1%) (+92.4%)'
    cost:
      total_calls: 12
      total_failed: 0
      model: google/gemini-2.5-flash-lite
      cost: '~$0.01'
      runtime: '67 seconds'
    interpretation: |
      The E12-N3 "underperformers" were a SINGLE-MODE dilution issue, not
      a real analyzer failure. The 3k-word single-pass prompt splits the
      LLM's attention across 6 categories (~17% per category). With
      focused multiWave + enabledWaves, the LLM has 100% attention on
      the labeled category and finds the issues reliably.

      This invalidates the E7-underperformers paper analysis: the
      fixtures weren't underperforming, the analyzer was being
      asked to look at 6 things at once. The P1-P3b fixes proposed
      in E7 are no longer needed — focused mode alone gives 98%
      detection.

      The 5584-char single-pass prompt is still useful for real-world
      skill analysis (where the analyzer is exploring an unknown
      document for ANY issue), but for fixture validation (where the
      labeled expected count is in a specific category), focused mode
      is strictly better.
    cross_validation_followup: |
      Should also re-test test-instruction-quality and test-contradictions-hard
      (the 2 E12-N3 outliers at 53% in-cat) with focused mode to confirm
      they were also single-mode dilution. Predicted: both will jump to
      80-100% in-cat.
    recommendation: |
      For future fixture-validation runs:
        - Use `analysisMode: 'multiWave'` + `enabledWaves: [specific]`
        - Run N=3 medians for noise-floor
        - Cost: 3-6 LLM calls per fixture (vs 1-3 for single mode)
        - But in-category detection is ~2-3x better
