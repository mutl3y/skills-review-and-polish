    hypothesis_verdict: SUPPORTED — combining the buildUserPrompt
      grounding (E8) with the coverage.prompt pre-check (E10) reduces
      median findings on v7 from 5 to 3 and cuts coverage-gap by 67%.
    remaining_noise_floor: |
      Two stable issues remain on v7+E8+E10:
        - cognitive-* (2/3 runs, flickers between deep-decision-tree
          and nested-conditions) — E9 investigation
        - hygiene-non-actionable-preamble on L9 (1/3 runs) — the
