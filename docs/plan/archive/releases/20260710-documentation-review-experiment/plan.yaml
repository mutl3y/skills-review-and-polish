  - id: E12-rerun
    title: Re-run E12 generalization test on the new E14+E15 baselines
    change_summary: |
      Re-ran the analyzer with E8+E10+E9+E11+E14+E15 fixes against all
      17 test fixtures (single mode, gpt-4o-mini, 30s cooldown).
      17 LLM calls, 0 rate-limit events. Compared each fixture's
      detection count against the E12 baseline (which was before
      E14/E15).
    files:
      - .github/experiments/documentation-review/data/e12-rerun-*.json (17 files)
      - .github/experiments/documentation-review/logs/e12-rerun-*.log
      - .github/experiments/documentation-review/notes/e12-rerun-vs-e12.md
    overall_summary:
      total_findings_raw: 86 -> 96 (+10)
      target_category_findings: 44 -> 48 (+4)
      target_category_rate: 22.2% -> 24.2% (+2.0pp)
    known_good_status:
      - test-contradictions-direct: '15 -> 15 (OK)'
      - test-contradictions-subtle: '12 -> 15 (overshoot — 3 extra findings)'
      - test-ambiguity-pub-and-empty: '2 -> 2 (OK)'
      - test-skill-itself-pub-ambiguity: '1 -> 0 (REGRESSION)'
    underperformer_status:
      - test-coverage-gaps: '3 -> 2 (WORSE -1)'
      - test-coverage-gaps-hard: '3 -> 2 (WORSE -1)'
      - test-circular-hard: '2 -> 2 (SAME)'
      - test-dead-hard: '3 -> 3 (SAME)'
    hypothesis_verdict: |
      INCONCLUSIVE — the E12 baseline used a SINGLE run per fixture
      (1 measurement per data point). The E12-rerun is also a single
      run. Per LEARNINGS.md, the noise floor is ±6 penalty points per
      scan, so single-run-vs-single-run comparisons are NOT
      statistically reliable. The "regressions" seen in
      test-ambiguities-hard (-9), test-contradictions-subtle (+3),
      test-contradictions-direct (+15, was rate-limited in E12),
      and test-cognitive-structural (+8) are all consistent with
      LLM noise, not real regressions.

      The CORRECT comparison would be: E12 baseline median-of-N
      (none collected) vs E12-rerun median-of-N (also not collected).
      To make a clean claim about whether E14/E15 regress
      detection, the next experiment should run N=3 per fixture on
      both pre-E14 and post-E14 analyzer versions and compare
      medians.
    lessons:
      - 'Single-run vs single-run detection counts can differ by ±5-15 findings per fixture (LEARNINGS.md noise floor)'
      - 'A "regression" detected on one run may be just noise; do not act on it without N=3 confirmation'
      - 'The 2 known-good fixture status is INCONCLUSIVE, not a hard regression'
    next_steps:
      - 'Run E12 with N=3 per fixture on BOTH pre-E14 and post-E14 analyzer versions, then compare medians'
      - 'This requires 17 × 3 × 2 = 102 LLM calls (~85 minutes) — significant but the only way to draw a clean conclusion'
