      No code changes. No skill changes. The v7 skill from the
      previous iteration is reused unchanged.
    input: .github/experiments/documentation-review/versions/v7/SKILL.md
    llm_calls: 3
    rate_limited: 0
    runs:
      - label: e10-v7-baseline
        total: 3
        codes: {ambiguity-llm: 1, cognitive-deep-decision-tree: 1, coverage-gap: 1}
      - label: e10-v7-stability-2
        total: 2
        codes: {cognitive-deep-decision-tree: 1, hygiene-non-actionable-preamble: 1}
      - label: e10-v7-stability-3
        total: 3
        codes: {ambiguity-llm: 1, cognitive-nested-conditions: 1, hygiene-redundant-instruction: 1}
    median_total: 3
    range: '2-3'
    delta_vs_v7_with_E8_only:
      median: '5 -> 3 (-40%)'
      range: '2-5 -> 2-3 (tighter)'
      coverage-gap: '3/3 -> 1/3 (-67%)'
      hygiene-redundant-instruction: '2/3 -> 1/3'
      cognitive-deep-decision-tree: '1/3 -> 2/3 (flicker, same heuristic family)'
      ambiguity-llm: '2/3 -> 2/3 (stable)'
    interpretation: |
      The E10 fix WORKED and stacks cleanly with E8:
        - coverage-gap dropped from 3/3 to 1/3 — the "search the
          document first" pre-check is having the predicted effect.
        - The range tightened (2-5 -> 2-3) — fewer extreme outliers.
