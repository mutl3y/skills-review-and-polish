  - id: E7-underperformers
    title: False Negative Investigation — 4 underperforming fixtures
    change_summary: |
      Paper analysis (no LLM calls) of the 4 fixtures that E12 flagged
      as underperformers (detection rate < 10%):
        - test-coverage-gaps: expected 15, detected 1 (7%)
        - test-coverage-gaps-hard: expected 15, detected 1 (7%)
        - test-dead-hard: expected 12, detected 1 (8%)
        - test-circular-hard: expected 10, detected 1 (10%; the
          task statement said 0% but the actual E12 data shows
          1 hygiene-circular-definition finding)
      Read each fixture's SKILL.md labeled table, the E12 findings
      JSON, the relevant prompt file (coverage.prompt, single-pass.prompt,
      hygiene.prompt), and the relevant analyzer code (processCoverage,
      processHygiene in src/core/analyzer.ts). Output: a comprehensive
      per-fixture analysis with 4 proposed fixes, priority ranking,
      and hypothesis verdict.
    inputs:
      fixtures:
        - tests/fixtures/primary/test-coverage-gaps/SKILL.md
        - tests/fixtures/adversarial/test-coverage-gaps-hard/SKILL.md
        - tests/fixtures/adversarial/test-dead-hard/SKILL.md
        - tests/fixtures/adversarial/test-circular-hard/SKILL.md
      e12_data:
        - .github/experiments/documentation-review/data/e12-test-coverage-gaps.json
        - .github/experiments/documentation-review/data/e12-test-coverage-gaps-hard.json
        - .github/experiments/documentation-review/data/e12-test-dead-hard.json
        - .github/experiments/documentation-review/data/e12-test-circular-hard.json
      prompt_files:
        - src/core/prompts/coverage.prompt
        - src/core/prompts/single-pass.prompt
        - src/core/prompts/hygiene.prompt
      code_files:
        - src/core/analyzer.ts (processCoverage, processHygiene)
        - src/core/types.ts (LLMCombinedAnalysisResponse schema)
    output: .github/experiments/documentation-review/notes/underperformer-investigation.md
    per_fixture_diagnosis:
      test-coverage-gaps:
        expected: 15
        detected: 1 (coverage-gap on GAP-2 air-gapped registry, line 10)
        root_cause: |
          E10's coverage.prompt pre-check ("search the document first")
          is too aggressive. The fixture's 15 gaps include cases where
          the document has a sentence mentioning the topic but no
          actionable procedure step (e.g. GAP-3 diamond deps: the
          document has "Also audit transitive dependencies" but no
          explicit diamond-dep handling). The LLM correctly fires
          the pre-check ("the document already addresses this") and
          suppresses the gap. The pre-check conflates "topically
          mentioned" with "scenario handled with actionable guidance".
        proposed_fix: P1 Option B (required-scope list)
        estimated_improvement: '7% -> 50%'
      test-coverage-gaps-hard:
        expected: 15
        detected: 1 (coverage-gap on GAP-H-1 secrets lifecycle, line 9)
        root_cause: |
          Same as test-coverage-gaps, but the hard fixture is
          intentionally thorough-looking (per its test metadata), so
          the LLM finds related content for nearly every gap
          ("Encryption" -> data residency, "Network Controls" ->
          rate limiting, "Audit Logging" -> alert SLAs) and
          suppresses. The fixture's 15 gaps are sub-domain
          specializations the document does not have dedicated
          sections for, but the LLM cannot distinguish between
          "section about the broad domain" and "section with
          actionable sub-domain guidance".
        proposed_fix: P1 Option B (shared with test-coverage-gaps)
        estimated_improvement: '7% -> 50%'
        cross_fixture_impact: 'Resolved by the same P1 fix'
      test-circular-hard:
        expected: 10
        detected: 1 (hygiene-circular-definition on HARD-CIRC-1, line 28)
        root_cause: |
          The hygiene.prompt pattern (h) is a 2-hop-only pattern
          that requires the structure "An X is [satisfies/meets/
          requires] Y. Y is [criteria/process] that applies to X."
          The 9 missed patterns fail this structure:
            - HARD-CIRC-2, -6, -10: tautological (verb is
              "classified", not "satisfies/meets/requires")
            - HARD-CIRC-3, -7: 3-hop circles (pattern h is 2-hop only)
            - HARD-CIRC-4, -8: reciprocal jargon (shared vocabulary
              but distinct terms like "VaR" vs "VaR confidence
              interval")
            - HARD-CIRC-5, -9: synonym loops with less obvious
              vocabulary overlap than HARD-CIRC-1
        proposed_fix: P2 Option B (deterministic graph detector)
        estimated_improvement: '10% -> 90%'
      test-dead-hard:
        expected: 12
        detected: 1 (hygiene-dead-instruction on HARD-DEAD-1, line 40)
        root_cause: |
          The hygiene.prompt pattern (e) requires "evidence of
          removal or deprecation ... present in the prompt itself."
          The test-dead-hard fixture is a CURRENT TOOL STACK
          document. It does not say "extensions/v1beta1 was
          removed in K8s 1.16" — it says "Kubernetes 1.29". For
          HARD-DEAD-1, the LLM fires because the contrast between
          "Kubernetes 1.29" and "extensions/v1beta1" is stark
          enough to overcome the prompt restriction. For the
          other 11 cases, the contrast is subtler:
            - HARD-DEAD-3 (PodSecurityPolicy): the document says
              "Pod Security Admission (built-in since K8s 1.25)"
              which IMPLIES PSP is replaced, but the LLM is told
              to flag only when the document EXPLICITLY notes the
              removal of the referenced feature.
            - HARD-DEAD-5 (`kubernetes.io/ingress.class`): the
              document says "use `ingressClassName` field" which
              implicitly deprecates the old annotation, but the
              LLM cannot infer deprecation from a contrasting
              positive statement.
            - HARD-DEAD-6 (`helm init`): the document says
              "Helm 2 is fully retired" which notes the retirement
              but the LLM doesn't connect it to the `helm init`
              command (the feature is the command, not "Helm 2").
        proposed_fix: P3 Option A first (relax "evidence of removal"
          rule), then P3 Option B (deterministic version-mismatch
          detector) if the prompt fix doesn't reach 60%.
        estimated_improvement: '8% -> 60% (P3a) or 90% (P3b)'
    proposed_fixes:
      - id: P1
        title: Required-scope list for coverage-gap pre-check
        layer: prompt + config
        files:
          - src/core/config.ts (add EngineConfig.requiredScopeCategories)
          - src/core/prompts/coverage.prompt (waive pre-check for
            required-scope categories)
          - src/core/prompts/single-pass.prompt (same in section 5)
          - src/core/analyzer.ts (pass config into prompt template)
          - scripts/e12-fixture-suite.mjs (parse "Required scope:"
            from Test metadata)
          - 2 sibling config files for the 2 coverage fixtures
        risk: low
        estimated_improvement: '7% -> 50% on each of 2 fixtures'
        cross_fixture_impact: 'Fixes 2 fixtures simultaneously'
      - id: P2
        title: Deterministic graph detector for circular definitions
        layer: code (new module)
        files:
          - src/core/circularDefinitions.ts (new, no LLM calls)
          - src/core/circularDefinitions.test.ts (10 unit tests)
          - src/core/analyzer.ts (call from processHygiene or new
            wave; merge results)
          - src/core/types.ts (extend LLMHygieneItem if needed)
        risk: low
        estimated_improvement: '10% -> 90% on 1 fixture'
        cross_fixture_impact: 'Fixture-specific, but generalizes
          to any definitional loop'
      - id: P3a
        title: Relax "evidence of removal" rule in pattern (e)
        layer: prompt-only
        files:
          - src/core/prompts/hygiene.prompt (pattern e)
        risk: medium
        estimated_improvement: '8% -> 60% on 1 fixture'
        cross_fixture_impact: 'Fixture-specific'
      - id: P3b
        title: Deterministic version-mismatch detector for dead instructions
        layer: code (new module)
        files:
          - src/core/deadInstructions.ts (new, no LLM calls)
          - src/core/deadInstructions.lookup.json (new, static
            version/command lookup table)
          - src/core/deadInstructions.test.ts (12 unit tests)
          - src/core/analyzer.ts (call from processHygiene; merge)
        risk: low
        estimated_improvement: '8% -> 90% on 1 fixture'
        cross_fixture_impact: 'Fixture-specific, but generalizes
          to other version-sensitive tools (AWS SDK, npm packages)'
    priority_ranking: [P1, P2, P3a, P3b]
    recommended_implementation_order: |
      1. P1 first: lowest risk, fixes 2 fixtures, prompt + config
         change is bounded and reversible.
      2. P2 second: deterministic detector is unit-testable, fixes
         the hardest fixture (0% -> 90%).
      3. P3a third: prompt-only fix, medium risk, can validate
         before committing to P3b's code change.
      4. P3b fourth: only if P3a doesn't reach 60% on the hard
         fixture.
    combined_improvement_estimate: '42% (22/52) -> 69% (36/52)
      across the 4 underperformers when all 4 fixes are implemented'
    hypothesis_verdict: |
      All 4 underperformers reflect REAL ANALYZER LIMITATIONS, not
      fixture design issues. The fixtures are well-built adversarial
      tests; the analyzer just has structural limitations on these
      3 categories:
        1. Coverage-gap: the E10 pre-check is calibrated for the
           documentation-review skill and over-suppresses on
           fixtures that test "scenario handled with actionable
           guidance" vs "topically mentioned".
        2. Circular-definition: the LLM-as-pattern-matcher
           approach has hit a ceiling on 3-hop circles, synonym
           loops, tautologies, and reciprocal jargon. A
           deterministic graph detector is the natural fix.
        3. Dead-instruction: the "evidence of removal in the
           prompt itself" rule is too strict for current-state
           documents. The fix needs to allow world-knowledge +
           contrasting-CURRENT-version detection.
      All 4 are worth fixing. None are fixture issues.
    follow_up_after_implementation:
      - 'Re-run E12 on the 4 underperformers to measure the actual delta (4 LLM calls)'
      - 'Re-run E12 on all 17 fixtures to verify no regressions'
      - 'Re-run E13 baseline (15 skills) to verify no real-world regressions'
      - 'Update LEARNINGS.md with the new "fix category by code type" taxonomy'
      - 'Add new adversarial fixtures that stress the deterministic pre-processors (test-circular-3hop, test-circular-tautology, test-dead-version-mismatch)'

learnings_for_future_iterations:
  length_penalty: |
    The LENGTH_PENALTY should reflect real-world skill size distribution,
    not an ideal. The 75th percentile of the awesome-copilot-fork corpus
    is 300 lines, so the "ideal" tier should be ≤300, not ≤200. The 800+
    cap of 35 was too aggressive (over 1.5× the next tier); the new cap of
    22 is a smoother gradient. When tuning the LENGTH_PENALTY, ALWAYS
    measure the corpus distribution first.

  scoring_bug: |
    The scoreSkill "empty results = Ungraded" rule was a latent bug that
    only became visible when re-computing grades from saved findings
    (i.e. the baseline pipeline). In the live analyzer, the post-processor
    almost always returns at least 1 finding, so the bug rarely fired.
    Lesson: when designing scoring functions, distinguish "no data" from
    "clean data" explicitly. A clean skill is a high-quality result, not
    a failure state.

  postprocess_pipeline: |
    The postprocess-baseline.py script + score-one-skill.js node script
    form a reusable pipeline for re-computing grades from any saved
    findings JSON. This is the foundation for compare-baseline.mjs to
    detect regressions in future analyzer versions.

process_improvements:
  baseline_pipeline: |
    Established a working baseline pipeline:
      1. scripts/baseline-fork.mjs (or shell driver) — runs analyzer on
         N skills, outputs per-skill findings JSON
      2. scripts/score-one-skill.js + scripts/postprocess-baseline.py —
         re-compute grades using the actual scoreSkill logic
      3. scripts/compare-baseline.mjs — diff two summary.json files
         and report regressions / improvements / new findings

  compare_tool_bug: |
    The compare-baseline.mjs tool initially flagged Ungraded→graded
    transitions as regressions (because Ungraded is at the END of the
    grade order, with the highest index). Fixed by treating Ungraded as
    "no grade" and only flagging regressions between real grades.

  shell_driver_pattern: |
    For long-running background jobs (15+ minutes), use a shell script
    driver that calls the experiment-loop per skill, with output
    redirected to a log file. Direct `node ... &` in the bash
    background gets killed when the turn ends. The shell driver
    survives the turn boundary.

files_modified_in_this_phase:
  - src/core/scoring.ts (length tiers + scoring fix)
  - src/core/scoring.test.ts (2 tests updated)
  - scripts/compare-baseline.mjs (new — diff tool)
  - scripts/score-one-skill.js (new — node scoring helper)
  - scripts/postprocess-baseline.py (rewritten — uses real scoreSkill)
