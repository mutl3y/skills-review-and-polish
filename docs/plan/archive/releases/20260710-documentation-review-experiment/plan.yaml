history:
  - version: v1
    date: 2025
    notes: Original verify-documentation skill. 296 lines. Heavy definitions section.
  - version: v2
    date: 2025
    notes: Renamed to documentation-review, restructured to use Requirements (R1, R2, ...). 325 lines.
  - version: v3
    date: 2026
    notes: Added Constraints (C1, C2, ...), Definitions renumbered (D1-D7). 401 lines. Current state.
  - version: v3-baseline
    date: 2026-07-10
    notes: |
      First analyzer pass on v3 (single mode, gpt-4o-mini, 5s cooldown).
      1 LLM call, 5.8s, no rate-limits.
      3 findings, all severity=warning:
        - ambiguity-llm @ L92: "Do not perform stylistic rewrites" is ambiguous
          (GENUINE PROMPT ISSUE — needs concrete examples or a glossary term)
        - cognitive-deep-decision-tree @ L17: steps are extensive
          (POSSIBLE FALSE POSITIVE — v3 already uses numbered steps)
        - coverage-gap @ L2: "edge cases for repository links that fail to resolve"
