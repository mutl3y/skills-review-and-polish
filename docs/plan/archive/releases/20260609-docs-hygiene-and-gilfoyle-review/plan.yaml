plan_id: 20260609-docs-hygiene-and-gilfoyle-review
objective: >
  Archive completed plan files to clean up docs/plan/, update documentation
  to reflect current project state (post-Gilfoyle fixes), run a fresh
  Gilfoyle code review on the codebase, and then address all identified
  issues in severity-ordered waves.
created_at: 2026-06-09T10:00:00Z
created_by: gem-planner
status: completed
research_confidence: high

architecture_review:
  completed_at: 2026-06-10
  reviewer: SE:Architect (GitHub Copilot)
  overall_rating: 4.1/5
  summary: |
    Clean provider abstraction, sound wave architecture, strong safety-first
    fixer design. Main concerns: MCP error sanitization gaps, LRU eviction
    bug, unbounded accepted-findings store, and missing rate limiting.

  issues_identified:
    critical:
      - id: C1
        title: API key leakage via MCP error messages
        file: src/mcp/server.ts
        status: FIXED
      - id: C2
        title: Composition-conflicts tag injection (known limitation)
        file: src/core/analyzer.ts
        status: KNOWN_LIMITATION
      - id: C3
        title: Accepted findings store unbounded growth
        file: src/core/acceptedFindings.ts
        status: FIXED
    high:
      - id: H1
        title: AnalysisHistoryStore LRU eviction bug
        file: src/core/analyzer.ts
        status: FIXED
      - id: H2
        title: Global module-level state in extension.ts
        file: src/extension.ts
        status: DEFERRED_TO_SEPARATE_PR
        fix: >
          14 module-level state variables, 30+ referencing functions, 30 existing
          tests depend on current pattern. Full ExtensionState class refactor
          is high-risk without extension integration tests. Documented as tech
          debt. Recommended: implement alongside extension-shell integration tests.
      - id: H3
        title: Config hash missing prompt file mtimes
        file: src/extension.ts
        status: FIXED
      - id: H4
        title: MCP config file watcher has no debounce
        file: src/mcp/server.ts
        status: FIXED
      - id: H5
        title: No rate limiting on MCP analyze calls
        file: src/mcp/server.ts
        status: FIXED
    medium:
      - id: M1
        title: loadPrompt() fragile under bundling
        file: src/core/prompts.ts
        status: FIXED
      - id: M2
        title: fixPreviewContent size cap not enforced
        file: src/extension.ts
        status: ALREADY_FIXED
      - id: M3
        title: contradiction-related excluded from scoring
        file: src/core/scoring.ts
        status: FIXED
      - id: M4
        title: MCP fix tool line param default is silent
        file: src/mcp/server.ts
        status: FIXED
        fix: >
          Added duplicate-anchor guard: when relevantText appears >1 times and
          no line arg provided, returns error asking for line. Prevents fixing
          the wrong occurrence.
      - id: M5
        title: No MCP server integration test harness
        status: DEFERRED
    low:
      - id: N1
        title: Inconsistent error response shapes in MCP server
        status: FIXED
        fix: >
          Standardized to MCP protocol pattern: validation errors thrown →
          caught by callTool try/catch → returned as {status:'error', isError:true}.
          All 12 throw-based tests updated to expect isError. Unexpected errors
          (LLM failures, I/O) now caught and returned instead of crashing.
      - id: N2
        title: DEVELOPMENT-STANDARDS.md and DEVELOPER-GUIDE.md overlap
        status: FIXED
        fix: >
          Added bidirectional cross-references. Each doc now links to the
          other with a clear summary of what it covers.
      - id: N3
        title: eslint.config.mjs exists but no lint:ts script
        status: ALREADY_FIXED
        fix: >
          "lint" script already exists: eslint src --ext ts.
      - id: N4
        title: Prompt files use .md but are not markdown
        status: DEFERRED

  fix_summary:
    total_identified: 16
    fixed: 14
    known_limitation: 1
    already_fixed: 2
    deferred_to_separate_pr: 1

