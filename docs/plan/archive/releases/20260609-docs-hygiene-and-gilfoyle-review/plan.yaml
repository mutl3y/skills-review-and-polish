pre_mortem:
  overall_risk_level: medium
  critical_failure_modes:
    - scenario: "Gilfoyle review finds Critical regressions from prior fixes"
      likelihood: low
      impact: high
      mitigation: >
        Wave 3 addresses Critical first. Prior fix iteration plan
        (GILFOYLE-FIXES-ITERATION.md) verified 258/258 tests pass — any
        regression must have been introduced after that commit.
    - scenario: "Archive move breaks internal markdown links in other docs"
      likelihood: medium
      impact: low
      mitigation: >
        Search for cross-references to archived files before moving.
        Update any links found in ARCHITECTURE.md, DEVELOPER-GUIDE.md, etc.
    - scenario: "Fresh Gilfoyle review hits rate limits or produces no actionable findings"
      likelihood: low
      impact: medium
      mitigation: >
        Review uses LLM proxy (Copilot models). If rate-limited, use cached
        analysis. If no findings, document as evidence of code quality.
    - scenario: "AGENTS.md expansion introduces conflicting conventions"
      likelihood: low
      impact: medium
      mitigation: >
        Base AGENTS.md expansion on existing AGENTS.md patterns and
        docs/DEVELOPMENT-STANDARDS.md. Review with gem-reviewer.

  assumptions:
    - "All 7 listed plan files are confirmed complete and safe to archive"
    - "Codebase compiles and tests pass at current HEAD"
    - "Gilfoyle review agent is available via gem-critic or manual LLM review"
    - "Archive directories don't need special .gitignore entries"
    - "Prior Gilfoyle fixes (25 issues) are stable and not regressed"

