        - measurement harness: structured=off (lower variance, reliable 10/10 completion)
      This avoids conflating "best product behavior" with "best experiment harness".

      Required changes:
        (1) Update documentation / LEARNINGS to explicitly distinguish the two.
        (2) For future prompt-iteration work, run noise-floor and keep/revert
