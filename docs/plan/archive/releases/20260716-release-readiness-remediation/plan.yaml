follow_ups_added_2026_07_17_b:
  - id: remeasure-noise-floor-after-truncation-fix
    severity: high
    description: >
      The +6 noise floor (LEARNINGS.md L8) was measured under the legacy
      60K-char truncation. With the analyzer now sending the whole document
      + all reference files, two things could shift:

        (a) Noise floor MAY grow — a 292K-char prompt is a larger surface
            for the underlying hosted MoE to introduce variance on. If the
            MoE models are sensitive to long-context tails, the +6 could
            become +8 or +12.
        (b) Noise floor MAY shrink — the previous floor was inflated by
            truncated-context edge cases where the model's behavior
            depended on which 30K of head/tail it saw. With a stable
            whole-document input, scoring variance could decrease.

      The right move: re-measure `PENALTY_NOISE_MARGIN` empirically on
      the same 5-iteration scan of the unchanged file that produced
      the +6 result. If the new floor differs, update the constant
      AND the LEARNINGS.md "noise floor" entry together — they must
      agree. If the new floor is the same, this is a useful negative
      result (truncation wasn't the floor driver) and proves the
      refactor didn't accidentally tighten the variance budget.

      Same probe should re-measure on at least 3 skill sizes (small
      < 5K, medium 30K, large 200K+) to detect any context-length
      correlation. Current expectation: noise is roughly constant
      across sizes once the prompt is stable.

      Also worth re-measuring simultaneously:
        - `SALVAGE_TRUNCATED_JSON` recovery rate under schema-mode
          (was 35/cycle baseline) — the truncation fix may have reduced
          the raw rate of truncations to begin with
        - Cross-fixture Jaccard stability vs the v8 multi-wave baseline
        - Median total-penalty on the calibration gate (was 73.1% capped
          recall) — worth knowing whether the change moved the
          central-tendency number, not just the spread
    command: >
      node scripts/run-with-log.mjs noise-floor-post-fix -- node -e "
        const { OpenRouterProvider } = await import('./out/providers/externalProvider.js');
        const { Engine } = await import('./out/core/index.js');
        // 5 iterations on the same input, score the median + range
        // expect: PENALTY_NOISE_MARGIN update if range > 12
      "
    acceptance:
      - "5-iteration scan of one small + one large file produces a total-penalty range <= 12 (no regression)"
      - "Recorded noise floor updates LEARNINGS.md and the noise-margin constant atomically"
      - "Cross-size comparison shows range stays constant within +-2 across small/medium/large prompts"
    estimated_runtime: "10 minutes"
  - id: defer-learnings-restructure
    severity: low
    description: >
      User feedback 2026-07-17: defer LEARNINGS.md restructure decision
      until E50 schema-mode + E61 production-skill re-runs land with
