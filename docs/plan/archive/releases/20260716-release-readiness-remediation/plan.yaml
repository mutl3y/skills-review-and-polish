id: 20260716-release-readiness-remediation
title: Release readiness remediation after independent review
status: implemented-beta-gates-passing-formal-release-not-ready
category: gilfoyle-reviews
created: 2026-07-16
owner: unassigned

summary: >
  Skills Review and Polish has the right product shape: focused LLM waves,
  provider seams, deterministic post-processing, safe surgical fixes, MCP
  support, and a useful calibration corpus. It should not be treated as formal
  release ready until the default model path, deep-model routing, calibration
  gate, single-pass parity, and documentation claims are corrected.

current_evidence:
  reported_fixture_recall: >
    2026-07-16 latest E50 clean-fixture gate after production-skill precision,
    large-document, output-budget, external-provider token-budget, fallback,
    finish-reason logging, HTTP-timeout fixes, structured-output wiring, and
    response-health instrumentation: 72.7% capped recall, 63.0% precision
    proxy, 1.15x over-report ratio, 27/43 categories at full median recall.
    A prior same-day run reached 76.7% capped recall and 75.0% precision
    proxy, so current direction is materially better than the original 42-47%
    baseline but still model-variance and response-shape sensitive.
  production_validation: >
    E61 real-skill validation was added after the fixture-only tuning risk was
    identified. It caught excessive ambiguity noise on sql-optimization
    (63 findings, 60 ambiguity) and reference-table hygiene noise on
    audit-integrity. After prompt/filter fixes, sql-optimization dropped to
    10 findings with 1 ambiguity in one sample, and the latest bounded-provider
    spot check found 20 findings with 7 ambiguity, still far below the original
    flood but not stable enough for formal release. audit-integrity table-link
    false positives were suppressed, with the latest spot check at 15 findings
    and no reference-table flood. quality-playbook no longer fails the deep
    wave with a context-limit error after head/tail excerpting for oversized
    documents.
  remaining_release_blockers: >
    Formal release remains blocked by frequent salvageTruncatedJSON recovery,
    deep-tier provider failures that require standard-tier fallback,
    model-dependent structured-output behavior, and 16/43 calibration
    categories still below full median recall. The 2026-07-16 wave-5
    structured-output work (live probes + retry-regex fix + schema default
    flip) is intended to remove the third blocker and reduce the first;
    an in-progress E50 run with STRUCTURED_OUTPUT=schema will determine
    whether the flip is the final default or stays opt-in.
  corpus_scan: "E56 found 8811 findings on 327 skills, up from 1664 in E30"
  key_risk: >
    More findings is promising but is not the same as validated recall or
    precision. Current validation still depends heavily on experiment scripts
    and manual interpretation.

waves:
  - id: wave-0-release-blockers
    title: Release blockers
    severity: critical
    status: completed
    exit_criteria:
      - "Default install path works for Copilot users without OpenRouter model IDs"
      - "OpenRouter and MCP construction pass deepModel into providers"
      - "Single-pass mode uses the same post-processing and accepted-finding pipeline"
      - "scoreSamples is either implemented or removed from user-facing claims"
    tasks:
      - id: fix-default-provider-model-contract
        status: completed
        files:
          - package.json
          - src/config.ts
          - docs/USER-GUIDE.md
          - README.md
        action: >
          Decide whether the default provider is Copilot auto-selection or
          OpenRouter Gemini. Align provider, model defaults, setup docs, and
          first-run behavior around one coherent default.
      - id: pass-deep-model-to-external-providers
        status: completed
        files:
          - src/extension.ts
          - src/mcp/server.ts
        action: >
          Pass cfg.deepModel and file/env deepModel into OpenRouterProvider
          and GitHubModelsProvider everywhere engines are constructed.
      - id: unify-single-pass-pipeline
        status: completed
        files:
          - src/core/index.ts
          - src/core/analyzer.ts
          - src/core/index.test.ts
          - src/core/findingFilter.integration.test.ts
        action: >
          Route single-pass results through consolidation, findingFilter,
          accepted-findings filtering, and loop handling, or document that
          single-pass is raw and make that explicit in UI and MCP outputs.
      - id: implement-score-samples
        status: completed
        files:
          - src/core/index.ts
          - src/core/scoring.ts
          - src/core/index.test.ts
          - docs/ARCHITECTURE.md
        action: >
          Implement actual median-of-N scoring from EngineConfig.scoreSamples,
          or remove the setting and all documentation claiming automatic
          median scoring.

  - id: wave-1-calibration-gates
    title: Calibration and release gates
    severity: high
    status: completed
    exit_criteria:
      - "A non-network unit gate validates deterministic mapping and scoring"
      - "A documented LLM calibration command produces release-blocking output"
      - "Clean fixtures, not labeled fixture bodies, are the primary benchmark"
    tasks:
      - id: promote-e50-to-release-gate
        status: completed
        files:
          - scripts/e50-clean-architecture.mjs
          - src/fixture-validation.test.ts
          - tests/fixtures/clean
          - tests/fixtures/expected
        action: >
          Make the clean-fixture architecture the official calibration path.
          Keep normal unit tests offline, but add a required release command
          that fails below agreed recall and precision thresholds.
      - id: add-category-metrics
        status: completed
        files:
          - scripts/e50-clean-architecture.mjs
          - tests/fixtures/expected
        action: >
          Report recall, precision proxy, over-report ratio, and per-category
          misses. Stop using total finding count as a quality proxy.
      - id: define-release-thresholds
        status: completed
        files:
          - tests/fixtures/README.md
          - docs/RELEASE-READINESS.md
        action: >
          Define beta, release-candidate, and formal-release thresholds.
          Suggested starting point: beta can ship at current 42-47% recall;
          formal release needs stable category thresholds and manual precision
          review on a production sample.

  - id: wave-2-prompt-and-detection-quality
    title: Prompt and detection quality
    severity: high
    status: completed
    exit_criteria:
      - "Contradiction and dead-instruction recall improve on clean fixtures"
      - "Coverage prompts balance silent-gap recall with precision checks"
      - "Post-processor rules are measured for false suppression"
    tasks:
      - id: improve-contradiction-direct
        status: completed
        files:
          - src/core/prompts/contradiction.prompt
          - tests/fixtures/clean/test-contradictions-direct.md
          - tests/fixtures/expected/test-contradictions-direct.json
        action: >
          Add targeted numeric-overlap, authority-conflict, and scope-overlap
          examples. Validate with N>=3 clean-fixture runs.
      - id: improve-dead-instruction
        status: completed
        files:
          - src/core/prompts/hygiene.prompt
          - tests/fixtures/clean/test-dead-hard.md
          - tests/fixtures/expected/test-dead-hard.json
        action: >
          Add deprecated-version, renamed-API, removed-template, and
          replacement-resource examples. Validate that production hygiene
          findings do not become generic speculation.
      - id: audit-post-processor-suppression
        status: completed
        files:
          - src/core/findingFilter.ts
          - src/core/findingFilter.test.ts
        action: >
          Add tests that prove each suppression rule does not hide a nearby
          true positive. Track suppressed count by rule in debug logs.
      - id: align-single-and-wave-prompts
        status: completed
        files:
          - src/core/prompts/single-pass.prompt
          - src/core/prompts/coverage.prompt
          - src/core/prompts/ambiguity.prompt
        action: >
          Remove stale constraints from single-pass prompts or document them
          as intentionally lower-recall. Keep shared rubric text in sync.

  - id: wave-3-product-trust-and-docs
    title: Product trust and documentation
    severity: medium
    status: completed
    exit_criteria:
      - "No public doc claims 86% or perfect detection unless revalidated"
      - "FAQ, user guide, README, package defaults, and handover agree"
      - "Telemetry setting is either implemented or marked unavailable"
    tasks:
      - id: correct-accuracy-claims
        status: completed
        files:
          - docs/ARCHITECTURE.md
          - docs/USER-GUIDE.md
          - README.md
          - docs/FAQS.md
          - docs/RELEASE-READINESS.md
        action: >
          Replace stale 86% Jaccard and 100% category claims with current
          clean-fixture recall, methodology, limitations, and beta wording.
      - id: reconcile-model-recommendations
        status: completed
        files:
          - docs/FAQS.md
          - docs/USER-GUIDE.md
          - package.json
          - docs/HANDOVER.md
        action: >
          Choose one current OpenRouter recommendation and mark older model
          conclusions as historical experiment results.
      - id: document-release-state
        status: completed
        files:
          - docs/RELEASE-READINESS.md
          - docs/plan/PROGRESS.md
        action: >
          Update release status from published/passing to beta with known
          accuracy limitations and explicit release gates.
      - id: telemetry-truthfulness
        status: completed
        files:
          - package.json
          - docs/USER-GUIDE.md
          - src/extension.ts
        action: >
          Implement telemetry or remove/disable the setting. Do not expose a
          default-on telemetry control that does nothing.

  - id: wave-4-fit-and-finish
    title: Fit and finish
    severity: low
    status: completed
    exit_criteria:
      - "MCP config parity matches VS Code config"
      - "Fix mode labels match actual behavior"
      - "Docs lint, compile, and unit tests pass"
    tasks:
      - id: mcp-config-parity
        status: completed
        files:
          - src/mcp/server.ts
          - src/mcp/README.md
        action: >
          Load analysisMode, analysisWaves, enabledWaves, deepModel,
          filterFindings, severityOverrides, and scoreSamples from MCP config.
      - id: fixer-release-positioning
        status: completed
        files:
          - docs/FIX-GUARDS.md
          - docs/USER-GUIDE.md
          - src/core/fixer.ts
        action: >
          Keep surgical fixing human-in-the-loop by default. Treat loop mode
          as experimental unless median scoring and fix quality gates are
          fully enforced.

  - id: wave-5-structured-output
    title: Structured JSON output across providers
    severity: high
    status: in-progress
    created: 2026-07-16
    exit_criteria:
      - "external.structuredOutput defaults to 'schema' on external providers"
      - "Live OpenRouter probes confirm strict schema adherence on Gemini Flash Lite and DeepSeek v3"
      - "E50 calibration with structuredOutput=schema meets the validation gate (no recall/precision regression)"
      - "Retry path strips response_format on 400/422 for both json_object and json_schema"
    tasks:
      - id: add-llm-response-schema
        status: completed
        files:
          - src/providers/llmResponseSchema.ts
        action: >
          Define LLM_RESPONSE_SCHEMA mirroring LLMCombinedAnalysisResponse.
          Use OpenRouter-compatible json_schema envelope (name + strict + schema).
      - id: widen-chatbody-and-provider
        status: completed
        files:
          - src/providers/externalProvider.ts
        action: >
          Widen ChatBody.response_format to json_object | json_schema. Default
          to 'schema' in both OpenRouterProvider and GitHubModelsProvider. Add
          buildResponseFormat() helper. Widen shouldRetryWithoutStructuredOutput
          regex to match json_schema (underscore form), which the original
          regex missed and silently broke the schema-rejection retry path.
      - id: wire-config-and-mcp
        status: completed
        files:
          - src/config.ts
          - src/mcp/server.ts
          - package.json
        action: >
          Widen externalStructuredOutput to boolean | 'schema'. Update
          package.json schema/default. Add readStructuredOutput (config) and
          structuredOutputValue (mcp) helpers.
      - id: update-e50-env-parser
        status: completed
        files:
          - scripts/e50-clean-architecture.mjs
        action: >
          STRUCTURED_OUTPUT env now accepts schema|json|off (default schema)
          and passes the value through to OpenRouterProvider. The legacy
          boolean behaviour (1=json_object, 0/empty=off) is preserved as
          aliases so existing scripts don't break.
      - id: live-probes
        status: completed
        files:
          - docs/plan/research/structured-output-provider-surfaces.md
        action: >
          Probed OpenRouter with toy schema + full LLMCombinedAnalysisResponse
          shape across Gemini Flash Lite and DeepSeek v3. json_schema returned
          exact adherence (8/8 keys, no enum violations) on both. json_object
          caused Gemini to invent its own shape. No mode produced truncation.
      - id: unit-test-coverage
        status: completed
        files:
          - src/providers/externalProvider.test.ts
          - src/config.test.ts
        action: >
          Cover all 3 modes (schema/true/false) on both providers. Add the
          json_schema-rejection retry test that exposed the regex bug.
          Cover readStructuredOutput env-like inputs.
      - id: e50-schema-validation
        status: in-progress
        files:
          - docs/plan/research/structured-output-provider-surfaces.md
        action: >
          Run npm run test:calibration with STRUCTURED_OUTPUT=schema and
          confirm recall >= 72.7%, precision >= 63.0%, salvage <= 5. If
          metrics regress, revert the default flip and keep 'schema' as
          an opt-in only.
      - id: run-with-log-helper
        status: completed
        files:
          - scripts/run-with-log.mjs
          - package.json
        action: >
          Add run-with-log.mjs that tees output to /tmp/<name>-<timestamp>.log
          plus a /tmp/<name>.log symlink. Add :log npm scripts for
          test:calibration, test:e2e, and vitest so long-running gates can
          be tailed live instead of waiting for the terminal stream.

verification:
  required_commands:
    - "npm run compile"
    - "npx vitest run --config tests/vitest.config.ts"
    - "npm run lint:md"
    - "npm run lint:md:fix"
  calibration_commands:
    - "node scripts/e50-clean-architecture.mjs --runs 3"
    - "node scripts/e61-production-current-validation.mjs"
    - "node scripts/e56-corpus-rescan-multimodel.mjs"

notes:
  - >
    2026-07-16 remediation pass: compile, full unit tests (493/493), and
    repository markdown lint pass. Added npm run lint:md:fix to normalize
    recurring markdown issues before delegating to markdownlint --fix.
  - >
    2026-07-16 live OpenRouter calibration: npm run test:calibration produced
    the E50 report with 69.6% capped recall, 67.8% precision proxy, and 1.03x
    over-report ratio. The report meets the configured beta gate
    (MIN_RECALL=0.42, MAX_OVER_REPORT_RATIO=3) but is still not formal-release
    quality: 20/43 categories remain below full median recall, including
    cognitive and hygiene-dead-instruction misses.
  - >
    The first live calibration process stayed open after writing its report
    because the harness only forced process exit on failure. The harness now
    closes the log stream and exits explicitly with 0 or 1 according to the
    configured release gate.
  - >
    The calibration run emitted frequent salvageTruncatedJSON messages across
    ambiguity, hygiene, coverage, and persona waves. Treat response truncation
    as a reliability risk to reduce before formal release, even when the gate
    threshold passes.
  - >
    Do not optimize solely for finding count. Every prompt change should
    report resolved, new, unchanged, and regression findings per the
    experiment workflow.
  - >
    Treat 42-47% clean/labeled recall as an honest beta baseline. It is
    better than nearby tools, but not enough for formal release claims.
  - >
    2026-07-16 production-skill validation: added
    scripts/e61-production-current-validation.mjs and validated prompt/filter
    changes against real skills, not just fixtures. The first E61 run showed
    fixture-tuned ambiguity behavior was not production-safe
    (sql-optimization: 63 findings, 60 ambiguity; audit-integrity:
    reference-table hygiene/dead/circular noise). The final spot checks were
    materially cleaner (sql-optimization: 10 findings, 1 ambiguity;
    audit-integrity: 14 findings, then 7/14 findings in follow-up spot checks
    after reference-table suppressions depending on model variance).
  - >
    2026-07-16 final gate rerun: npm run compile passed, full unit suite
    passed (23 files, 512 tests), npm run lint:md passed, and
    npm run test:calibration passed the configured beta release gate with
    74.0% capped recall, 68.3% precision proxy, and 1.08x over-report ratio.
    This improves the beta posture but does not remove the formal-release
    blockers above.
  - >
    2026-07-16 response reliability pass: external providers now default to
    the same 16384 response-token budget as VS Code LM, oversized documents
    are analyzed as explicit head/tail excerpts instead of failing provider
    context limits, and each wave has prompt/output caps plus deterministic
    processor caps. quality-playbook E61 no longer hits the deep-model
    context-limit error.
  - >
    OpenAI-compatible JSON mode was implemented as an opt-in provider option
    (`structuredOutput`) with fallback when `response_format` is rejected for
    structured-output-specific reasons. It is wired through VS Code settings,
    MCP file/env config, E50, and E61, but is deliberately off by default:
    E61 real-skill testing with STRUCTURED_OUTPUT=1 introduced extra
    llm-parse-error/salvage noise on the current OpenRouter Gemini path. Keep
    it as a model/provider experiment until a disjoint production batch proves
    it lowers parse failures.
  - >
    2026-07-16 latest verification: npm run compile passed, focused
    analyzer/provider/filter tests passed (3 files, 170 tests), full unit
    suite passed (23 files, 524 tests), npm run lint:md passed, and
    npm run test:calibration passed with 76.7% capped recall, 75.0% precision
    proxy, and 1.02x over-report ratio.
  - >
    2026-07-16 bounded-provider pass: a calibration rerun stalled at 20/45
    jobs because external provider fetches had no wall-clock timeout. Added
    requestTimeoutMs to OpenRouter/GitHub Models providers, defaulting to
    120000ms and treating timeout/cancellation as non-retryable for that
    request. npm run compile passed, focused analyzer/provider/filter tests
    passed (3 files, 174 tests), full unit tests passed (23 files, 528 tests),
    npm run lint:md passed, and the rerun completed with 73.1% capped recall,
    65.4% precision proxy, 1.12x over-report ratio, and 24/43 categories at
    full median recall. The gate passes beta thresholds but does not meet
    formal-release expectations because salvageTruncatedJSON and deep-tier
    fallback remain frequent.
  - >
    2026-07-16 bounded-provider production spot check: E61 on context-map,
    sql-optimization, and audit-integrity completed with structured output off.
    Results were context-map 12 findings, sql-optimization 20 findings
    including 7 ambiguity findings, and audit-integrity 15 findings. This
    confirms the 60-ambiguity sql-optimization flood is reduced, but also
    shows production precision remains variable and salvageTruncatedJSON still
    appears on real skills.
  - >
    2026-07-16 response-health instrumentation: E50 and E61 now report
    salvage recoveries, non-stop finish reasons, finishReason=error/length,
    deep fallbacks, and provider errors in their summaries/artifacts. A
    context-map A/B check showed structuredOutput=off produced 8 findings with
    response health salvage=0, nonStopFinish=2, finishError=2; structuredOutput=on
    produced 6 findings with salvage=1, nonStopFinish=2, finishError=2. This
    reinforces keeping JSON mode opt-in for the current OpenRouter Gemini
    route.
  - >
    2026-07-16 latest E50 with response-health counters: npm run
    test:calibration passed the configured beta gate with 72.7% capped recall,
    63.0% precision proxy, 1.15x over-report ratio, and 27/43 categories at
    full median recall. Response health was salvage=35, nonStopFinish=60,
    finishError=60, finishLength=0, deepFallback=37, providerError=0. This is
    clear evidence that the current OpenRouter Gemini + DeepSeek route remains
    too brittle for formal release despite better-than-baseline detection.
  - >
    2026-07-16 structured-output probe + default flip (wave 5): the previous
    "keep structuredOutput off" advice in this plan was based on evidence
    from `STRUCTURED_OUTPUT=1` which only enabled `json_object` mode — not
    `json_schema`. Live OpenRouter probes
    (`docs/plan/research/structured-output-provider-surfaces.md`) confirmed
    that `json_schema` produces strict adherence on both Gemini Flash Lite and
    DeepSeek v3, while `json_object` causes Gemini to invent its own shape
    (the exact near-miss shape `salvageTruncatedJSON` exists to recover).
    Implementation: new `src/providers/llmResponseSchema.ts`,
    `external.structuredOutput` widened to `boolean | 'schema'` with
    `'schema'` as the new default, retry-path regex widened from
    `json schema` to `json[_ -]?schema` (the original silently failed on
    the underscore form OpenRouter uses in error text), and the E50
    `STRUCTURED_OUTPUT` env parser updated to accept `schema|json|off`.
    Bug also caught during validation: the E50 script was passing
    `structuredOutput: false` to the provider regardless of the provider's
    own default, so an earlier "off" E50 run was a stale baseline. Fixed
    by widening the script's env parser.
  - >
    2026-07-16 E50 off-mode sanity rerun (after wave-5 wiring, but before
    the E50 env parser was updated): capped recall 77.1%, precision proxy
    58.9%, over-report ratio 1.31x, 25/43 categories at full median recall.
    Response health: salvage=16, nonStopFinish=17, finishError=17,
    deepFallback=0, providerError=0. The deepFallback collapse (37 -> 0)
    is the clearest signal that recent response-reliability changes have
    stabilised the OpenRouter route; the slight recall gain and precision
    regression suggest we are near the edge of the noise floor. The
    schema-mode E50 run is the actual test of whether the wave-5 default
    flip is a net win.
  - >
    2026-07-16 run-with-log helper: added `scripts/run-with-log.mjs` and
    `npm run test:calibration:log`, `npm run test:e2e:log`, `npm run
    vitest:log`. Long-running gates now tee to `/tmp/<name>-<timestamp>.log`
    with a `/tmp/<name>.log` symlink so they can be `tail -f`'d live
    instead of waiting for the terminal stream to drain.

notes_post_e50_schema_validation:
  - >
    2026-07-17 analyzer no-truncation refactor (resolves quality-blocking issue
    discovered during E50 schema-mode validation). The legacy 60K-char
    `MAX_ANALYSIS_DOCUMENT_CHARS` cap and head/tail slicing were removing the
    middle of any skill over 60K chars. For `quality-playbook` (294K chars,
    2,739 lines), lines 256-2262 — the actual quality protocols, decision
    trees, scoring rubrics, and verification logic — were invisible to the
    model. The contradictions wave would systematically miss cross-section
    findings because the middle never reached the LLM.

    Probe (`scripts/probes/verify-full-doc.mjs`) confirms: a 292K-char skill now
    produces a 293K-char prompt including 6 reference files, no head/tail
    marker. The prompt instruction "Read the ENTIRE document below" is now
    literal, not aspirational.

    Implementation: `provider.getContextLength()` is the new required
    interface method. `VsCodeLmProvider` reads `maxInputTokens` from cached
    `vscode.LanguageModelChat`. `OpenRouterProvider` and `GitHubModelsProvider`
    accept a `contextLength` constructor opt. The analyzer computes
    `max(MIN, ctxTokens × 4 × 0.8)` per call. 200K-char fallback with
    `info`-level warning when context is unknown. Reference files (linked
    `.md`) are now included for all 6 waves, not just composition-conflicts.
    Files that would overflow the budget are dropped with a marker rather
    than truncated mid-content.

    MCP `createDefaultEngine` is now async and awaits `pickSmallestContextLength`
    at startup. ~140ms cold fetch (1h cached, ~5ms warm). No more 200K fallback
    hits on the cold path for users with OpenRouter API keys.

    Model catalog refactor: `src/modelCatalog.ts` now has three tiers — live
    OpenRouter catalog (primary, ~1,215 entries) → bundled asset
    (`assets/openrouter-catalog.json`, top-75 popular models, ~4.5KB shipped
    in the .vsix) → 5-entry static table (niche Copilot display names and
    GitHub Models IDs not in OpenRouter). Bundled asset refresh:
    `node scripts/refresh-openrouter-catalog.mjs` (auto-runs on
    `vscode:prepublish`). Test fixture (`tests/fixtures/openrouter-catalog.json`)
    keeps the full 1,215-entry catalog for drift detection.

    Static table slimmed from 38 entries (mostly dead code already in
    OpenRouter) to 5 entries (`gpt-4o mini`, `gemini 2.0 flash`,
    `gemini 3.0 pro`, `mistral-small-2503`, `phi-3.5-mini-instruct`).
    Drift detection test fails if any static entry is now in the catalog.

    New npm scripts: `npm run refresh-fixtures` (just the catalog),
    `npm run release:gate` (refresh + compile + test + lint + lint:md),
    `vscode:prepublish` (refresh + compile) auto-runs before every
    `vsce package` / `vsce publish`.

    End-to-end probe (`scripts/probes/probe-cache-priority.mjs`) confirms the
    chain: cold 139ms network → 0ms in-memory cache → fixture on network
    failure → static table on niche names → undefined → 200K analyzer
    fallback.
  - >
    2026-07-17 measured real-world token costs (probe
    `scripts/probes/measure-tokens.mjs`): quality-playbook SKILL.md alone = 70K tokens
    (fits all viable models); quality-playbook + 28 references = 155K
    tokens (fits 1M-context gemini-2.5-flash-lite, OVERFLOWS 128K-context
    llama-3.1-8b-instruct). mutl3y-foreman SKILL.disabled.md = 7K tokens;
    +63 references = 72K tokens (fits both). The 200K-char fallback would
    truncate quality-playbook SKILL.md even alone — needed per-model budget.

  - >
    2026-07-17 plan status: this turn resolves the analyzer truncation
    blocker (a long-standing quality regression). It does NOT complete
    the `e50-schema-validation` task from wave-5 — that E50 run was
    interrupted mid-fixture (only 3/15 fixtures completed before the
    conversation pivoted to the truncation issue). The schema-mode E50
    needs to be re-run to confirm the `STRUCTURED_OUTPUT=schema` default
    flip is a net win on recall and precision.

