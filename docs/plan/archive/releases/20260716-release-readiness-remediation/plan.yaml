notes_added_2026_07_17_user_correction:
  user_pushback_acknowledged: >
    User correctly noted that the noise-floor probe used test-contradictions-direct,
    a labeled calibration fixture with synthetic contradiction-heavy content.
    The +55 number is real for that content class, but it does NOT transfer
    directly to production skills. Both the legacy +6 floor AND the new +55
    measurement were on labeled-fixture-class content. The relative shift
    (+6 → +55) IS a real signal about analyzer-level variance, but the
    absolute magnitude of the shift on real skills is unknown.

  corrected_interpretation:
    what_we_can_say: >
      "The whole-doc + reference-inclusion analyzer has ~10x higher
      per-iteration variance than the legacy 60K-cap analyzer on labeled
      fixtures." — Confirmed by direct measurement. Useful as a prompt-iteration
      tool (any prompt fix that the analyzer suggests needs to clear a wider
      noise band before being declared a real improvement).

    what_we_cannot_say: >
      "Production skills now have a +55 noise floor." — NOT confirmed. Real
      skills have different shape: longer, fewer labeled findings per token,
      more arbitrary content the model may or may not flag. The +55 number
      is best treated as an upper bound on the noise we should expect,
      not the actual production noise.

    practical_implication: >
      Until we measure production-skill variance, we should:
        (1) Keep the legacy PENALTY_NOISE_MARGIN = 6 in code with a
            "needs re-measurement on production content" comment.
        (2) For prompt-fix keep/revert decisions on production skills,
            use sample-N >= 5 (not the historical default of N=3) until
            we have better data. The increased sample size does not
            cost more in API spend than one more calibration run; it
            does cost more in iteration time.
        (3) Document the +55 labeled-fixture measurement in LEARNINGS as
            a signal that triggered the sample-size change, with a
            note that this is a ceiling not a floor.

    measurement_gap: >
      To fill the gap, the right probe is "5 runs of each of quality-playbook,
      sql-optimization, audit-integrity, structured-autonomy-plan — running
      the E61 harness with scoreSamples=5 instead of the default 1." That's
      ~10 production-skill runs × 6 waves × $0.001 = ~$0.05 and ~15 minutes.
      Until we run it, the +55 number is our best estimate of the upper bound,
      not the actual production noise.

