notes_added_2026_07_17_crossWaveDedup_stale_expectation:
  finding: >
    The expected count "ambiguity-llm: 11" on test-contradictions-direct
    predates the crossWaveDedup post-processor rule (E42, 2026-07-10).
    The expected JSON is dated 2026-07-12, two days *after* E42 landed.
    But the notes file says "calibration applied per e33-calibration.md
    honest review" — calibration, not post-processor adjustments.

    Concrete evidence from the 2026-07-17T09:57 schema-mode run:
      schema-mode finds ambiguity-llm at lines [11, 19, 20, 24] (4 findings)
      stronger categories (contradiction, persona, hygiene) flag the same
        lines [11, 19, 24]
      crossWaveDedup would suppress 3 of the 4 → 1 surviving finding
      off-mode finds ambiguity-llm at exactly 1 line — consistent

    So the *correct* post-dedup expectation for test-contradictions-direct
    ambiguity-llm is 1, not 11. The 11 was a pre-dedup hand-count.

  impact_across_fixtures:
    description: >
      If this pattern holds (expected counts hand-counted before E42),
      other fixtures may have similar over-counts in categories where
      crossWaveDedup now suppresses them. Worth re-deriving expected
      counts for at least the 5 fixtures we just ran schema-mode on.

  recommended_followup: >
    For each calibration fixture, run the analyzer with crossWaveDedup
    DISABLED, capture the per-category finding counts, and compare to
    the current expected JSON. Where they differ, the expected count
    needs updating (and the notes file needs to say "post-dedup count").

    Cost: ~5 min per fixture × 15 fixtures = ~75 min, ~$0.10. Cheap,
    but not strictly necessary for the v0.1.39 release because recall
    is the more important number and is genuinely up.

