  probe_b_noise_floor_artifact:
    first_attempt_path: .github/experiments/documentation-review/data/e50-clean-architecture-2026-07-17T11-00-27-263Z.json
    first_attempt_result: "5 runs: [124, 106, 0 (timeout), 98, 152]. Range 152 (but 1 timeout) — biased high by timed-out zero."

    second_attempt_path: scripts/probes/noise-floor-10x.mjs (direct engine probe)
    second_attempt_result:
      runs_completed: "9 of 10 (1 timed out at 240s)"
      totals_sorted: "[87, 104, 109, 116, 129, 131, 152, 160, 197]"
      range: 110
      median: 129
      half_range_margin: "+55"
      baseline: "30/32/38/38/42 → range 12, +6 floor (LEARNINGS L8)"
    verdict: >
      The noise floor has moved from +6 to +55 — almost 10x. This is a REAL,
      MEANINGFUL shift, not artifact. The whole-doc + reference-file analyzer
      has higher per-iteration variance than the legacy 60K-cap analyzer.

      The legacy number was measured with gpt-4.1 + temperature 0. We just
      measured with gemini-flash-lite + temperature 0 (default). The +55
      number conflates model-specific variance + analyzer-specific variance +
      post-processor nondeterminism. Before publishing a new PENALTY_NOISE_MARGIN,
      we should:
        (1) Run a 10-iteration noise probe with the same model the legacy
            measurement used (gpt-4.1 or equivalent Copilot recommendation).
            This isolates the analyzer-specific variance.
        (2) If gpt-4.1 floor is also shifted (likely to ~+25-30), update
            constant atomically with LEARNINGS.md.
        (3) If only gemini is shifted, document gemini-flash as having a
            different floor and use model-specific margins.

      The legacy +6 was load-bearing for keep/revert decisions on prompt
      experiments. With +55, every prompt-iteration experiment would need
      110-pt delta to be detectable. That kills fast iteration. We need to
      lower the per-iteration variance through:
        - Median-of-N at the prompt-rendering layer (deterministic seeding
          where possible)
        - Tighter post-processor (fewer nondeterministic rules)
      OR adopt sample-size-N>3 for keep/revert decisions.

