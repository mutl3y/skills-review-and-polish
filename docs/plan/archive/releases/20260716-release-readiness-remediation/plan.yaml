            sections that themselves belong in LEARNINGS
        (3) The 4 way-too-long sections (Gilfoyle, pricing-cache,
            post-processor, never-slice) need a single bulk
            restructure, not piecemeal edits

      Recommended approach when unblocked: the "Restructure + trim"
