notes_added_2026_07_17_user_correction_b:
  metric_confusion_corrected: >
    User correctly asked what unit the "+55" number is in. It is a
    SEVERITY-WEIGHTED TOTAL PENALTY (errors=4, warnings=3, hints=2, info=1),
    not a finding count. The actual raw finding-count range across 9
    successful runs was 16 findings (40 to 56), which is ~30% of the
    50-finding baseline. The legacy +6 floor was also a penalty total,
    so the apples-to-apples comparison is:
      Legacy 60K-cap: penalty range 12 (30→42)
      New whole-doc:  penalty range 54 (98→152)
    Per-finding range is ~16 in the new analyzer, likely ~5-8 in legacy
    (no finding-count history kept — LEARNINGS L8 only logs penalties).

  this_is_huge_for_a_user: >
    User correctly identified that "+55 is huge" for a noise floor.
    16-finding variance on a 50-finding document is one-third of the
    total — large enough that the same prompt-fix evaluated twice could
    show a 16-finding swing purely from randomness. Keep/revert decisions
    on a 5-finding delta are not meaningful at this floor.

  is_this_just_model_variance: >
    NO. Most of the +16 finding-count range is post-processor
    nondeterminism, not model variance. crossWaveDedupRule (in
    src/core/findingFilter.ts:605) iterates `others` in the order
    findings arrive from the 6 parallel wave calls. Different runs of
    the same input produce findings in different orders, and the
    suppression result depends on order because the rule's logic is
    "if a stronger finding covers the same span, suppress this one"
    and the FIRST match wins.

    The fix is to sort `others` by `(analyzer, code, range.start.line)`
    before iterating, so the suppression pattern is deterministic given
    the same set of findings. Expected impact: most of the +16 variance
    disappears, leaving only the irreducible LLM noise (likely +5-8
    findings).

  work_implication: >
    This is a higher-leverage fix than chasing the prompt-iteration
    noise margin. If we can get post-processor variance down, we get
    back most of the old +6 floor for free. The work item:
      - Sort crossWaveDedupRule `others` argument by (analyzer, code, range.start.line)
      - Verify with a 10x probe that finding-count range drops to ~5-8
      - Update LEARNINGS.md floor entry to reflect the new measurement
      - Update PENALTY_NOISE_MARGIN only after production-skill probe
        also measures the new floor

follow_ups_added_2026_07_17_g:
  - id: deterministic-post-processor
    severity: high
    description: >
      crossWaveDedupRule.matches() iterates `others` in whatever order
      findings arrive from the 6 parallel wave calls. Two runs of the
      same input can produce different suppression patterns if findings
      arrive in different orders.

      Fix: sort `others` by (analyzer, code, range.start.line, range.start.character)
      before iterating. ~5 lines of code in src/core/findingFilter.ts.

      Verification: re-run scripts/probes/noise-floor-10x.mjs with the fix
      applied. If finding-count range drops from 16 to ~5-8, the
      post-processor variance was the dominant contributor.

      Risk: low. The sort is purely on the `others` argument, doesn't
      change the input finding set, just the order they're evaluated in.
      Worst case, the rule's behavior changes for one input class where
      the iteration order was load-bearing; we'd see a one-time change
      in post-fix E50 numbers which is exactly the desired signal.

      Cost: ~5 min implementation + ~10 min verification = ~15 min.
    command: >
      Manual edit to src/core/findingFilter.ts crossWaveDedupRule.matches:
      const sortedOthers = others
        .filter(o => o !== candidate)
        .slice()
        .sort((a, b) => (a.analyzer||'').localeCompare(b.analyzer||'') ||
                         a.code.localeCompare(b.code) ||
                         (a.range?.start?.line ?? 0) - (b.range?.start?.line ?? 0) ||
                         (a.range?.start?.character ?? 0) - (b.range?.start?.character ?? 0));
      Then iterate `sortedOthers` instead of `others`.

    blocked_by: null

  - id: publish-correct-noise-floor-numbers
    severity: medium
    description: >
      Once deterministic-post-processor lands and is verified, update
      LEARNINGS.md "noise floor" entry to publish BOTH numbers:
        - Severity-weighted penalty range: (measurement)
        - Raw finding-count range: (measurement)
      The legacy +6 number was penalty. The current +55 is penalty. The
      raw finding-count range is the user-facing number (count of
      "findings on a re-scan of the same input").

      Suggested text:
        "The analyzer's per-iteration variance is dominated by post-processor
        rule ordering on cross-wave findings, not irreducible LLM noise.
        With deterministic post-processor (commit <hash>), the legacy
        ~+6 noise margin (severity-weighted) holds across labeled fixtures.
        Raw finding-count variance is ~5-8, comparable to legacy."

    blocked_by: deterministic-post-processor

