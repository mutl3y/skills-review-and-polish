notes_added_2026_07_17_post_hardening_5slice:
  purpose: >
    User correctly challenged the sequence: the post-hardening 5-fixture
    slice should be rerun before spending more budget on the 10x noise probe.
    This note captures that like-for-like comparison.

  pre_hardening_reference:
    artifact: .github/experiments/documentation-review/data/e50-clean-architecture-2026-07-17T10-11-56-417Z.json
    recall: 87.3%
    precision_proxy: 63.3%
    over_report_ratio: 1.38x
    response_health: salvage=0, nonStopFinish=2, finishError=2, finishLength=0
    categories_at_100: 12/15
    misses:
      - test-ambiguities-hard / ambiguity-llm (13/20)
      - test-circular-hard / cognitive (0/1)
      - test-coverage-gaps-hard / coverage-gap (8/10)

  post_hardening_result:
    artifact: .github/experiments/documentation-review/data/e50-clean-architecture-2026-07-17T16-42-03-011Z.json
    recall: 83.5%
    precision_proxy: 73.3%
    over_report_ratio: 1.14x
    response_health: salvage=0, nonStopFinish=0, finishError=0, finishLength=0
    categories_at_100: 11/15
    misses:
      - test-ambiguities-hard / ambiguity-llm (13/20)
      - test-circular-hard / cognitive (0/1)
      - test-coverage-gaps-hard / hygiene (1/3)
      - test-coverage-gaps-hard / coverage-gap (7/10)

  delta:
    recall: "DOWN 3.8pts (87.3 -> 83.5)"
    precision: "UP 10.0pts (63.3 -> 73.3)"
    over_report: "DOWN 0.24x (1.38 -> 1.14)"
    response_health: "Schema response-shape issues fully eliminated on this slice (2 finish errors -> 0)."

  conclusion: >
    The provider hardening succeeded technically — it removed the response-
    health failures and materially improved precision — but it also reduced
    recall on the 5-fixture calibration slice. That means the fallback from
    schema -> no-response_format on finish_reason:error|length is acting as a
    precision-vs-recall trade. It is not a free win.

    Therefore the next engineering question is not "does hardening help?"
    (yes, for precision/health) but "where should the fallback apply?" Two
    strong candidates:
      (1) standard tier only (Gemini is the main offender)
      (2) retry only on finish_reason:error, NOT on finish_reason:length
    so that high-recall long responses are not demoted unnecessarily.

    The user's sequencing point was correct: the 5-slice rerun was necessary
    to interpret the later 10x off-mode comparison. The right next move is a
    narrower provider hardening, not another broad noise probe.

